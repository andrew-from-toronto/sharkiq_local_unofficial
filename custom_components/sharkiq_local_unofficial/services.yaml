clean_rooms:
  target:
    entity:
      integration: sharkiq_local_unofficial
      domain: vacuum
  fields:
    rooms:
      required: true
      example: '["Kitchen", "Hallway"]'
      selector:
        text:
          multiple: true
    matrix:
      default: false
      selector:
        boolean:

clean_spot:
  target:
    entity:
      integration: sharkiq_local_unofficial
      domain: vacuum
  fields:
    x:
      required: true
      example: 1.2
      selector:
        number:
          min: -100
          max: 100
          step: 0.1
          unit_of_measurement: m
    y:
      required: true
      example: -0.4
      selector:
        number:
          min: -100
          max: 100
          step: 0.1
          unit_of_measurement: m
